name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  # Il sito in un browser vero: tutte le pagine (Sicilia, Lazio, nessuna regione), i percorsi dei moduli
  # e tutte le combinazioni di risposte. Regole in docs/protocollo-test.md.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Sito in locale
        run: python3 -m http.server 8080 >/dev/null 2>&1 &
      - run: node tests/browser.cjs http://localhost:8080/
      - run: node tests/combinazioni.cjs http://localhost:8080/
      - run: node tests/robustezza.cjs http://localhost:8080/
  # I dati regionali contro le copie notturne delle pagine ufficiali (branch copie-siti, tools/copie.mjs).
  # Non blocca le PR: le pagine ufficiali cambiano di notte. Regole in docs/protocollo-test.md.
  copie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: copie-siti
          path: copie-siti
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Solo un resoconto: le copie hanno buchi noti (pagine fatte con JavaScript, siti giù).
      # Il controllo resta verde e l'elenco dei problemi va nel riepilogo del job, da leggere a ogni PR.
      - run: |
          set +e
          node tools/confronta-copie.mjs copie-siti/copie > confronto.txt 2>&1
          esito=$?
          cat confronto.txt
          # 3 = differenze trovate (resoconto). Ogni altro codice è un errore del programma: il controllo diventa rosso.
          if [ $esito -ne 0 ] && [ $esito -ne 3 ]; then exit $esito; fi
          [ $esito -eq 3 ] && echo "::warning::confronta-copie ha trovato differenze: vedi il riepilogo"
          { echo '## Dati contro copie dei siti ufficiali'; echo '```'; tail -n 60 confronto.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
