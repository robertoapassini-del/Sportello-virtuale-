name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  # Il sito in un browser vero: tutte le pagine (Sicilia, Lazio, nessuna regione), i percorsi dei moduli
  # tutte le combinazioni di risposte (anche con il fuso orario di New York), Numeri utili provincia per provincia
  # in ogni regione attiva, telefoni vecchi e reti lente (senza JavaScript, senza dati, 640x360 al 200%), lettere stampate,
  # copiate e mandate per email.
  # Tre job in parallelo (in serie erano 25 minuti): «browser» (pagine, robustezza, Numeri utili, telefoni vecchi,
  # lettere), «combinazioni» (fuso di Roma) e «combinazioni-ny» (fuso di New York).
  # Ogni tests/*.cjs deve stare in uno di questi job: lo controlla tests/workflow.test.mjs.
  # Regole in docs/protocollo-test.md.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      # pdfinfo e pdftotext per tests/lettere-stampa.cjs (senza, il test conta le pagine nel PDF e legge il testo dal browser).
      - run: |
          sudo apt-get install -y poppler-utils || echo "senza poppler-utils: lettere-stampa.cjs usa il ripiego"
      - name: Sito in locale
        run: python3 -m http.server 8080 >/dev/null 2>&1 &
      - run: node tests/browser.cjs http://localhost:8080/
      - run: node tests/robustezza.cjs http://localhost:8080/
      - run: node tests/numeri-province.cjs http://localhost:8080/
      - run: node tests/telefoni-vecchi.cjs http://localhost:8080/
      - run: node tests/lettere-stampa.cjs http://localhost:8080/
  combinazioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Sito in locale
        run: python3 -m http.server 8080 >/dev/null 2>&1 &
      - run: node tests/combinazioni.cjs http://localhost:8080/
  # Le stesse combinazioni con un altro fuso orario (Node e browser): il conto dei giorni non deve cambiare.
  combinazioni-ny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Sito in locale
        run: python3 -m http.server 8080 >/dev/null 2>&1 &
      - run: TZ=America/New_York TZID=America/New_York node tests/combinazioni.cjs http://localhost:8080/
  # I dati contro le copie notturne delle pagine ufficiali (branch copie-siti, tools/copie.mjs).
  # Blocca solo i problemi nuovi sui dati che la PR cambia: un numero, una PEC, un indirizzo di invio, un orario
  # o una sede INPS che la copia della pagina ufficiale non conferma. Non bloccano: i problemi già noti
  # (tests/copie-noti.txt: pagine fatte con JavaScript, siti giù), i dati uguali a main (la pagina ufficiale
  # è cambiata di notte: «non di questa PR», nel riepilogo) e gli url nuovi, che si copiano dopo l'unione.
  # Regole in docs/protocollo-test.md.
  copie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: copie-siti
          path: copie-siti
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # I dati di main, per sapere quali dati ha cambiato la PR.
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: |
          set +e
          node tools/confronta-copie.mjs copie-siti/copie --noti tests/copie-noti.txt --base origin/main > confronto.txt 2>&1
          esito=$?
          cat confronto.txt
          { echo '## Dati contro copie dei siti ufficiali'; echo '```'; sed -n '/== Contro/,$p' confronto.txt; echo '```';
            echo '<details><summary>Tutti i problemi</summary>'; echo; echo '```'; head -n 200 confronto.txt; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          # 0 = niente di nuovo sui dati cambiati; 3 = dati nuovi o cambiati che la copia non conferma (rosso);
          # 2 = mancano le copie o main; 1 = il programma si è rotto.
          [ $esito -eq 3 ] && echo "::error::confronta-copie: dati nuovi o cambiati che la copia della pagina ufficiale non conferma (vedi il riepilogo)"
          exit $esito
